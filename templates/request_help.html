{% extends "base.html" %}

{% block title %}Request Help - BrightHelp{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='request_help.css') }}">
{% endblock %}

{% block content %}
<div class="request-page">
    <form class="request-form" method="POST" action="/request-help">

        <div class="input-group">
            <span class="icon">👤</span>
            <input type="text" name="name" placeholder="Your Name" required>
        </div>

        <div class="input-group">
            <span class="icon">📍</span>
            <input type="text" name="location" placeholder="Location" required>
        </div>

        <div class="input-group">
            <span class="icon">🛟</span>
            <input type="text" name="help_type" placeholder="Type of Help" required>
        </div>

        <div class="textarea-group">
            <textarea name="description" placeholder="Describe the help you need" required></textarea>
        </div>

        <button type="submit">Submit Request</button>

        <a href="/" class="back-home">Back to Home</a>
    </form>
</div>
{% endblock %}
